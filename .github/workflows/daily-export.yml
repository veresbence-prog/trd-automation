name: Daily TRD Export

on:
  schedule:
    # Runs at 06:00 UTC every weekday (adjust the hour for your timezone;
    # Budapest is UTC+1 in winter, UTC+2 in summer).
    - cron: '0 6 * * 1-5'
  workflow_dispatch:  # lets you trigger it manually from the GitHub Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated file back

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run export script
        env:
          TRD_USERNAME: ${{ secrets.TRD_USERNAME }}
          TRD_PASSWORD: ${{ secrets.TRD_PASSWORD }}
        run: python daily_export_automation.py

      - name: Commit and push updated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_export.xlsx
          git diff --staged --quiet || git commit -m "Daily export update"
          git push
